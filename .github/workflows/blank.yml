name: Build Kernel lavender

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v3

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install bc bison build-essential ccache curl flex git gnupg gperf \
            libncurses5-dev libssl-dev python3 python-is-python3 zip zlib1g-dev

      - name: Download Clang toolchain
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilt
          echo "PATH=$GITHUB_WORKSPACE/clang-prebuilt/clang-r416183b/bin:$PATH" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          mkdir out
          make O=out lavender_defconfig
          make -j$(nproc) O=out

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: lavender-kernel-4.19.157
          path: out/arch/arm64/boot/Image.gz-dtb
